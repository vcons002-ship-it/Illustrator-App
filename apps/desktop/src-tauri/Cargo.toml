[package]
name = "visual-reader-desktop"
version = "1.0.0"
edition = "2021"
description = "Visual Reader desktop shell — wraps the web UI and manages the local GPU inference engine."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Streamed checkpoint/engine downloads (blocking client, used inside spawn_blocking).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# Unpack the official ComfyUI Windows portable .7z (bundled Python — no system install).
sevenz-rust = "0.6"
