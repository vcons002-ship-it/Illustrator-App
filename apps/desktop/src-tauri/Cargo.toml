[package]
name = "visual-reader-desktop"
version = "1.0.0"
edition = "2021"
description = "Visual Reader desktop shell — wraps the web UI and manages the local GPU inference engine."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Streamed checkpoint/engine downloads (blocking client, used inside spawn_blocking).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# Body encoding for the `http_fetch` CORS proxy (invoke payloads are JSON, not binary).
base64 = "0.22"
# BUILD PIN, not used directly: time 0.3.48 collides with tauri-utils 2.9.2's blanket
# From impls under recent rustc coherence (E0119). Cargo.lock is gitignored, so the
# ceiling must live here for fresh clones to build; drop when tauri-utils ships a fix.
time = { version = ">=0.3.47, <0.3.48", default-features = false }
# Unpack the official ComfyUI Windows portable .7z (bundled Python — no system install).
sevenz-rust = "0.6"
# Cross-platform screen capture for the chat's screenshot tool (Win/macOS/Linux).
xcap = "0.0.14"
# Encode the captured frame to PNG bytes for the renderer/vision model.
image = { version = "0.25", default-features = false, features = ["png"] }
# Native folder picker for the assistant's working-folder control (Win/macOS/Linux).
rfd = "0.15"
# URL-encode the OAuth consent URL / decode the redirect query (Google loopback).
percent-encoding = "2"
